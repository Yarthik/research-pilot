[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchpilot"
dynamic = ["version", "dependencies"]
description = "Agentic research assistant: hybrid retrieval, cross-encoder reranking and a self-correcting LangGraph agent with citations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kartik Kaushik" }]

[project.scripts]
researchpilot = "researchpilot.cli:main"

[tool.setuptools.dynamic]
version = { attr = "researchpilot.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["researchpilot*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: downloads the local models (needs network); run with `pytest -m slow`"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["storage"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends/File in argument defaults is the documented pattern

[tool.ruff.lint.per-file-ignores]
"researchpilot/agent/prompts.py" = ["E501"]  # prompt text reads better unwrapped
"evals/judge.py" = ["E501"]

[tool.coverage.run]
source = ["researchpilot", "evals"]
