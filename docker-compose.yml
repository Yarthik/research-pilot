# UI + API as two services sharing one document index (owned by the API).
#   cp .env.example .env   # add your API key
#   docker compose up --build
#   UI:  http://localhost:8501     API docs: http://localhost:8000/docs
services:
  api:
    build: .
    command: ["uvicorn", "researchpilot.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      SERVICE: api
      PORT: "8000"
      AUTO_INGEST_SAMPLES: "true"
    ports:
      - "8000:8000"
    volumes:
      - storage:/app/storage
    restart: unless-stopped

  ui:
    build: .
    env_file: .env
    environment:
      API_URL: http://api:8000
      PORT: "8501"
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  storage:
