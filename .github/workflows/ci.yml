name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit + integration tests (no API keys, no model downloads)
        run: pytest -m "not slow" --cov --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (downloads the local models)
        run: docker build -t researchpilot .
      - name: Smoke test the API container
        run: |
          docker run -d --name api -p 8000:8000 -e SERVICE=api -e PORT=8000 researchpilot \
            uvicorn researchpilot.api.main:app --host 0.0.0.0 --port 8000
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -sf http://localhost:8000/health | grep '"status":"ok"'
          docker logs api
